<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心のカルテ Student | カモシカのコンサル</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic Pro','Noto Sans JP',system-ui,sans-serif;background:#faf8f4;color:#2c2c2c;min-height:100vh;line-height:1.7}
#app{max-width:680px;margin:0 auto;padding:0 20px 80px}
.progress-bar{position:fixed;top:0;left:0;width:100%;height:3px;background:#e8e0d4;z-index:100}
.progress-fill{height:3px;background:#8b5e3c;transition:width .4s ease}
.progress-label{position:fixed;top:10px;right:16px;font-size:11px;color:#999;z-index:100}
.header{padding:48px 0 8px;text-align:center}
.brand{font-size:11px;letter-spacing:.2em;color:#8b5e3c}
.title{font-size:22px;font-weight:700;margin-top:8px}
.subtitle{font-size:13px;color:#777;margin-top:6px}
.section-intro{padding:60px 0 40px;text-align:center}
.section-num{font-size:11px;letter-spacing:.2em;color:#8b5e3c}
.section-title{font-size:24px;font-weight:700;margin:12px 0 16px}
.section-desc{font-size:14px;color:#666;line-height:1.8}
.btn{display:inline-block;margin-top:20px;padding:14px 36px;background:#8b5e3c;color:#fff;border:none;border-radius:3px;font-size:14px;cursor:pointer;letter-spacing:.05em;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-outline{background:transparent;color:#8b5e3c;border:1.5px solid #8b5e3c}
.btn-outline:hover{background:#8b5e3c;color:#fff}
.btn-sm{padding:10px 24px;font-size:13px}
.name-input{width:100%;max-width:320px;padding:12px 16px;border:1.5px solid #e8e0d4;border-radius:3px;font-size:16px;background:#fff;margin-top:24px;display:block;margin-left:auto;margin-right:auto;text-align:center}
.name-input:focus{outline:none;border-color:#8b5e3c}
.question-wrap{padding:52px 0 20px}
.q-meta{font-size:11px;color:#aaa;letter-spacing:.1em;margin-bottom:20px}
.q-text{font-size:18px;font-weight:600;line-height:1.6;margin-bottom:28px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{padding:16px 20px;background:#fff;border:1.5px solid #e8e0d4;border-radius:4px;cursor:pointer;font-size:14px;line-height:1.6;transition:all .2s;text-align:left;width:100%}
.opt:hover{border-color:#8b5e3c;background:#fdf6f0}
.opt.selected{border-color:#8b5e3c;background:#fdf6f0;font-weight:600}
.opt.confirmed{border-color:#8b5e3c;background:#8b5e3c;color:#fff}
.nav-back{display:block;margin-top:24px;font-size:12px;color:#aaa;cursor:pointer;text-align:center}
.nav-back:hover{color:#8b5e3c}
/* results */
.results{padding:48px 0}
.results-header{text-align:center;margin-bottom:36px}
.results-title{font-size:22px;font-weight:700}
.results-date{font-size:12px;color:#aaa;margin-top:4px}
.results-name{font-size:15px;color:#666;margin-top:8px}
.card{background:#fff;border:1.5px solid #e8e0d4;border-radius:6px;padding:24px 28px;margin-bottom:18px}
.card-label{font-size:10px;letter-spacing:.2em;color:#8b5e3c;margin-bottom:10px;font-weight:600}
.card-main{font-size:20px;font-weight:700;margin-bottom:6px}
.card-sub{font-size:13px;color:#555;line-height:1.7}
.card-desc{font-size:13px;color:#666;line-height:1.8;margin-top:10px;border-top:1px solid #f0ece6;padding-top:10px}
.stage-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-bottom:10px}
.bar-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px}
.bar-label{width:72px;flex-shrink:0;color:#555;font-size:12px}
.bar-bg{flex:1;height:8px;background:#f0ece6;border-radius:4px;overflow:hidden}
.bar-fill{height:8px;background:#8b5e3c;border-radius:4px}
.bar-fill-sub{background:#c4a882}
.bar-val{width:28px;text-align:right;color:#888;font-size:11px}
.message-box{background:#fdf6f0;border-left:3px solid #8b5e3c;padding:16px 20px;border-radius:0 4px 4px 0;font-size:14px;line-height:1.9;color:#333;margin-top:10px}
.arctype-name{font-size:26px;font-weight:700;color:#8b5e3c;margin-bottom:6px}
.theme-chip{display:inline-block;padding:4px 12px;background:#f0ece6;border-radius:20px;font-size:12px;margin:3px 3px 3px 0;color:#555}
.theme-chip.top{background:#8b5e3c;color:#fff}
/* consciousness table */
.toggle-btn{background:none;border:1px solid #e8e0d4;border-radius:3px;padding:8px 16px;font-size:12px;cursor:pointer;color:#666;width:100%;text-align:left;margin-bottom:0}
.toggle-btn:hover{border-color:#8b5e3c;color:#8b5e3c}
.c-table{width:100%;font-size:12px;border-collapse:collapse;margin-top:12px}
.c-table th{background:#2c2c2c;color:#fff;padding:6px 10px;text-align:left;font-weight:600;font-size:11px}
.c-table td{padding:6px 10px;border-bottom:1px solid #f0ece6;vertical-align:top}
.c-table tr:hover td{background:#fdf6f0}
/* submit form */
.submit-form{background:#fff;border:1.5px solid #e8e0d4;border-radius:6px;padding:24px 28px;margin-top:24px}
.submit-form h3{font-size:14px;font-weight:700;margin-bottom:16px;color:#2c2c2c}
.rating-group{margin-bottom:16px}
.rating-label{font-size:13px;color:#555;margin-bottom:8px;display:block}
.rating-stars{display:flex;gap:8px}
.star{font-size:24px;cursor:pointer;color:#e8e0d4;transition:color .15s;background:none;border:none;padding:0}
.star.active{color:#8b5e3c}
.comment-area{width:100%;padding:12px;border:1.5px solid #e8e0d4;border-radius:3px;font-size:13px;font-family:inherit;resize:vertical;min-height:80px;margin-top:4px}
.comment-area:focus{outline:none;border-color:#8b5e3c}
.submit-status{font-size:13px;color:#666;margin-top:12px;min-height:20px}
.submit-status.ok{color:#4caf50}
.submit-status.err{color:#e57373}
/* forced-choice 2択 */
.q-fc-tag{font-size:11px;letter-spacing:.15em;color:#8b5e3c;margin-bottom:14px;text-align:center}
.opts--fc{flex-direction:row;gap:14px}
.opts--fc .opt{flex:1;min-width:0;text-align:center;padding:22px 14px;font-size:14px;line-height:1.8;border-radius:6px;font-weight:500}
@media(max-width:480px){.opts--fc{flex-direction:column}}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2c2c2c;color:#fff;padding:10px 22px;border-radius:4px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast.ok{background:#4caf50}
.toast.err{background:#e57373}
@media print{
  .progress-bar,.progress-label,.nav-back,.action-btns,.submit-form,.toggle-btn{display:none!important}
  body{background:#fff;font-size:12px}
  #app{max-width:100%;padding:0 12px}
  .card{break-inside:avoid;border:1px solid #ccc;padding:14px 16px;margin-bottom:10px}
  .card-main{font-size:16px}
  .arctype-name{font-size:20px}
  .message-box{font-size:12px;padding:10px 14px}
  #ctable{display:block!important}
}
</style>
</head>
<body>
<div class="progress-bar"><div class="progress-fill" id="pbar" style="width:0%"></div></div>
<div class="progress-label" id="plabel"></div>
<div id="app"></div>
<script>
// Student版：ローカル完結。外部送信（GAS）・アクセスコード・サーバー連携はなし。
// 結果は受診完了時にTSVとHTMLの2ファイルをダウンロードフォルダへ自動保存する。

// ── 質問データ（Student版：高校生の場面に翻訳。スコア・ベクトルは大人版と完全同一）──
const S=[
  {num:1,title:"朝と日常",desc:"いつもの自分を、もう少し近くで見てみる"},
  {num:2,title:"人との関わり",desc:"誰かといるとき、あなたはどこにいる？"},
  {num:3,title:"学校と役割",desc:"教室や部活の中の自分を観察してみる"},
  {num:4,title:"自己認識",desc:"自分の内側に少しだけ潜ってみる"},
  {num:5,title:"世界との関係",desc:"自分と世界のあいだを見つめる"},
];

const Q=[
{id:1,s:1,type:'c',q:"朝、目が覚めた直後に感じることに近いのは？",opts:[
  {jp:"また学校か…という重さがある",c:50},
  {jp:"今日も頑張らなければ、とすぐ思う",c:125},
  {jp:"特に意識することもなく、とりあえず起きて動き出す",c:250},
  {jp:"今日は何かある、という軽い楽しみがある",c:310},
  {jp:"目覚めること自体がわりと心地よい",c:640},
]},
{id:2,s:1,type:'ei',q:"授業や行事が詰まった一日が終わった後、自分はどうなりがち？",opts:[
  {jp:"少し疲れるが、帰り道に友達と話すことでエネルギーが戻る",v:1},
  {jp:"充実感はあるが、一人になって静かにしたい",v:-1},
  {jp:"刺激になる。もっと話し続けたいと思う",v:2},
  {jp:"疲れる。回復に時間がかかり、一人の時間が必要",v:-2},
  {jp:"疲れ方は内容やメンバーによってまちまち",v:0},
]},
{id:3,s:1,type:'ffs',q:"毎日決まってやること（起きる時間・勉強のやり方など）について、どう感じる？",opts:[
  {jp:"安心する。いつも通りだと落ち着いて動ける",v:{ac:1,ma:5,exp:1,di:2,co:2}},
  {jp:"大切だとはわかるが、飽きてくる",v:{ac:2,ma:2,exp:3,di:2,co:2}},
  {jp:"いつものやり方は守りながら、少しずつ良くしていきたい",v:{ac:2,ma:4,exp:2,di:3,co:3}},
  {jp:"しばらくすると変えたくなる。同じことを続けるのは苦手",v:{ac:2,ma:1,exp:4,di:2,co:2}},
  {jp:"気づいたら全く違うことをしている。決まったやり方自体が続かない",v:{ac:1,ma:1,exp:5,di:1,co:1}},
]},
{id:4,s:1,type:'jp',q:"テスト勉強や課題の計画を立てることについて、自分に一番近いのは？",opts:[
  {jp:"予め詳細に決めないと落ち着かない",v:2},
  {jp:"計画は立てるが、変更が入っても普通に受け入れられる",v:1},
  {jp:"大まかな方向だけ決めて、あとは流れに合わせる",v:-1},
  {jp:"計画より、その場の状況に合わせて判断する方が得意",v:-2},
  {jp:"計画を立てる行為自体を楽しむ。予定通り進むことが好き",v:2},
]},
{id:5,s:1,type:'c',q:"一人で過ごす休日（予定なし）、気づけば何をしている？",opts:[
  {jp:"何もできないまま時間が過ぎている",c:50},
  {jp:"何かしなければと焦って、結局ダラダラする",c:100},
  {jp:"SNSや動画をなんとなく見て時間を使う",c:125},
  {jp:"好きなことに、気づけば没頭できている",c:400},
  {jp:"何もしなくても、それで満足している",c:640},
]},
{id:6,s:1,type:'ffs',q:"新しいアプリや勉強のやり方を取り入れるとき、自分はどうなる？",opts:[
  {jp:"評判やレビューを確認してから判断する。未知のものは慎重に",v:{ac:2,ma:4,exp:2,di:3,co:2}},
  {jp:"今のやり方と比較して、メリットが明確なら切り替える",v:{ac:2,ma:3,exp:2,di:4,co:2}},
  {jp:"変えない理由がないと動けない。今のやり方への信頼が強い",v:{ac:2,ma:5,exp:1,di:2,co:3}},
  {jp:"比較的すぐ取り入れる。面白そうなら試してみる",v:{ac:2,ma:2,exp:4,di:2,co:2}},
  {jp:"変えること自体が好き。新しいものは積極的に試したい",v:{ac:1,ma:1,exp:5,di:2,co:1}},
]},
{id:7,s:1,type:'ei',q:"難しい問題や悩みごとに直面したとき、まず自分はどうする？",opts:[
  {jp:"友達や家族に話して、頭を整理する",v:1},
  {jp:"一人でじっくり考えてから、どうするか決める",v:-1},
  {jp:"話しながら考えるのが得意。言葉に出すことで見えてくる",v:2},
  {jp:"考えがある程度まとまるまで、誰にも言わない",v:-2},
  {jp:"まず状況を書き出して、紙の上で整理する",v:0},
]},
{id:8,s:1,type:'sf',q:"何かをやりきったとき、あなたが最も充実感を感じる瞬間は？",opts:[
  {jp:"こなした量・積み上げた成果を感じるとき",v:{ex:5,in:1,rb:1,st:1}},
  {jp:"問題を見つけて直して、ちゃんと前に進めたとき",v:{ex:4,in:1,rb:2,st:2}},
  {jp:"計画通りに、整然と着実に動けたとき",v:{ex:5,in:1,rb:1,st:1}},
  {jp:"一つのことだけに絞って、深く集中できたとき",v:{ex:5,in:1,rb:1,st:1}},
  {jp:"やると決めたことを、最後まで責任を持って貫いたとき",v:{ex:5,in:1,rb:1,st:1}},
]},
{id:9,s:1,type:'d',q:"食事のとき、あなたはどうしていることが多い？",opts:[
  {jp:"食べることだけに集中している",c:250},
  {jp:"勉強や明日のことが頭にある",c:250},
  {jp:"一緒にいる人との会話を楽しんでいる",c:250},
  {jp:"スマホを見ていることが多い",c:250},
  {jp:"特に何も考えていない",c:250},
]},
{id:10,s:1,type:'c',q:"思い通りにならないことが続いたとき、心の中で何が起きる？",opts:[
  {jp:"「自分はついていない」という感覚が強まる",c:50},
  {jp:"誰かや状況のせいにしたくなる",c:150},
  {jp:"落ち込むが、時間が経てば回復できる",c:200},
  {jp:"何かパターンがあるはずと、原因を探そうとする",c:310},
  {jp:"「今は流れが悪い時期」と受け止めて、無理せず待つ",c:350},
]},
{id:11,s:2,type:'c',q:"列に並んでいるとき、前の人に割り込まれた。あなたはどうする？",opts:[
  {jp:"何も言えない。でも内心ずっとモヤモヤする",c:100},
  {jp:"心の中では怒るが、言っても無駄だと黙る",c:150},
  {jp:"少し驚くが、気にせず待ち続ける",c:250},
  {jp:"「すみません、列に並んでいます」と落ち着いて伝える",c:200},
  {jp:"その人に急ぎの事情があるのかもと思う",c:400},
]},
{id:12,s:2,type:'tf',q:"仲のいい友達が、あなたから見て間違った選択をしようとしているとき、どうする？",opts:[
  {jp:"論理的に問題点を整理して、率直に伝える",v:1},
  {jp:"まずその友達の気持ちや事情を聞いてから、自分の考えを伝える",v:-1},
  {jp:"間違いだと思っても、最終的には本人の判断を尊重する",v:-2},
  {jp:"事実と起きそうなことを明確に示して、良い選択をするよう促す",v:2},
  {jp:"言うかどうか迷う。正直に伝えることで関係が壊れないか気になる",v:0},
]},
{id:13,s:2,type:'ffs',q:"誰かが自分に話を打ち明けてくれているとき、自分はどうしている？",opts:[
  {jp:"相手が何を感じているかに自然と意識が向く",v:{ac:5,ma:2,exp:2,di:1,co:2}},
  {jp:"話を聞きながら、解決策を考え始めてしまう",v:{ac:2,ma:2,exp:3,di:4,co:3}},
  {jp:"相手の言葉をまず全部聞いてから、自分の考えを伝える",v:{ac:4,ma:3,exp:2,di:3,co:2}},
  {jp:"自分の似た経験と重ねて、共感しながら聞く",v:{ac:3,ma:2,exp:2,di:2,co:2}},
  {jp:"相手が求めていることが何かを確認してから動く",v:{ac:4,ma:3,exp:2,di:2,co:3}},
]},
{id:14,s:2,type:'c',q:"誰かにお礼やほめ言葉を言われたとき、あなたはどうなる？",opts:[
  {jp:"もっと認めてほしい、という気持ちが出てくる",c:125},
  {jp:"照れくさくて「大したことないよ」と言ってしまう",c:175},
  {jp:"うれしいが、すぐ忘れる",c:250},
  {jp:"素直に「ありがとう」と受け取れる",c:310},
  {jp:"相手の喜びが、そのまま自分の喜びになる",c:640},
]},
{id:15,s:2,type:'sf',q:"人との関係の中で、あなたが自然と感じる充実感は？",opts:[
  {jp:"時間をかけて積み上げた、少数の人との深い信頼",v:{ex:1,in:1,rb:5,st:1}},
  {jp:"人と人・出来事がつながっている感覚。縁の不思議を感じる",v:{ex:1,in:1,rb:5,st:2}},
  {jp:"場に明るさをもたらす。ポジティブなエネルギーが場を変える",v:{ex:1,in:3,rb:5,st:1}},
  {jp:"流れに乗って、変化する場にしなやかに適応する",v:{ex:1,in:2,rb:5,st:1}},
  {jp:"その人の感情を深く理解して、そっと寄り添うこと",v:{ex:1,in:1,rb:5,st:1}},
]},
{id:16,s:2,type:'tf',q:"誰かの決断（先生の方針や友達の選択）を見るとき、まず何を見る？",opts:[
  {jp:"論理的に整合性があるか。根拠と結論がつながっているか",v:2},
  {jp:"その決断を下すまでの過程や、本人の思いを大切にする",v:-1},
  {jp:"結果として誰かが傷ついていないか",v:-2},
  {jp:"目標達成に向けて有効な判断だったか",v:1},
  {jp:"判断の正しさより、それを実行できるかの方が気になる",v:0},
]},
{id:17,s:2,type:'c',q:"友達が自分に悩みを相談してくるとき、どう感じる？",opts:[
  {jp:"面倒に巻き込まれそうで、少し憂鬱になる",c:100},
  {jp:"相談される自分を、少し頼られていると感じる",c:175},
  {jp:"すぐに解決策を出してあげようとする",c:175},
  {jp:"まずちゃんと話を聞こうとする",c:310},
  {jp:"その友達の気持ちに自然と関心が向く",c:640},
]},
{id:18,s:2,type:'ffs',q:"クラスや部活の雰囲気が悪くなっているとき、あなたはどうなりがち？",opts:[
  {jp:"自然と場を和ませようとする言葉や行動が出てくる",v:{ac:5,ma:2,exp:2,di:1,co:2}},
  {jp:"何が原因かを把握しようとする",v:{ac:2,ma:2,exp:2,di:5,co:3}},
  {jp:"自分には関係ない問題として、距離を置く",v:{ac:1,ma:2,exp:3,di:5,co:2}},
  {jp:"誰かが傷ついていないかを真っ先に気にする",v:{ac:4,ma:2,exp:2,di:2,co:2}},
  {jp:"解決策を提案して、早く前に進めるようにしようとする",v:{ac:2,ma:2,exp:3,di:3,co:3}},
]},
{id:19,s:2,type:'sf',q:"人と関わるとき、あなたが自然と向かうことは？",opts:[
  {jp:"その人が今どう感じているか、感じ取ろうとする",v:{ex:1,in:1,rb:5,st:1}},
  {jp:"その人の可能性を見て、成長を後押ししたいと思う",v:{ex:2,in:2,rb:5,st:1}},
  {jp:"場が和やかで、全員が安心していることを確認する",v:{ex:1,in:1,rb:5,st:1}},
  {jp:"誰も取り残されていないか、端に追いやられていないか",v:{ex:1,in:2,rb:5,st:1}},
  {jp:"その人だけの固有の才能・強みを見つけようとする",v:{ex:1,in:1,rb:5,st:2}},
]},
{id:20,s:2,type:'c',q:"しばらく話していなかった友達から、久しぶりにLINEが来た。どう感じる？",opts:[
  {jp:"どう返せばいいか迷って、後回しにしてしまう",c:75},
  {jp:"何か頼まれそうで、少し警戒する",c:100},
  {jp:"返信はするが、関係を深める気にはなれない",c:175},
  {jp:"また繋がれた偶然を面白いと思う",c:350},
  {jp:"純粋に懐かしくて、嬉しい",c:400},
]},
{id:21,s:3,type:'c',q:"テストや課題の提出が迫っていて、間に合わない可能性が出てきた。あなたはどうする？",opts:[
  {jp:"頭が真っ白になって動けなくなる",c:100},
  {jp:"誰かや状況のせいにしたくなる",c:150},
  {jp:"焦りながらも、できることをやり続ける",c:200},
  {jp:"早めに先生や親に状況を伝えて、相談する",c:310},
  {jp:"何を諦めるかを整理して、優先順位をつける",c:350},
]},
{id:22,s:3,type:'sf',q:"クラスや部活でみんなを動かすとき、あなたが自然と使っているものは？",opts:[
  {jp:"まず自分が動き始める。最初の一手が人を引きつける",v:{ex:3,in:5,rb:1,st:1}},
  {jp:"言葉で場を作る。話すことでエネルギーが生まれる",v:{ex:1,in:5,rb:2,st:1}},
  {jp:"初対面でも自然に関係を作る。場を温める",v:{ex:1,in:5,rb:3,st:1}},
  {jp:"自分の確信が伝わる。迷いのなさが人を動かす",v:{ex:2,in:5,rb:1,st:1}},
  {jp:"良いものをさらに卓越させることに情熱を注ぐ",v:{ex:2,in:4,rb:1,st:2}},
]},
{id:23,s:3,type:'sn',q:"「信頼できる情報」とはどんなものだと思う？",opts:[
  {jp:"実績や数字で裏付けられたもの",v:2},
  {jp:"複数の視点から見ても整合性があるもの",v:-1},
  {jp:"実際に体験した人の話や感覚",v:1},
  {jp:"大きなパターンや流れから読み解けるもの",v:-2},
  {jp:"根拠が明確で、論理的に筋が通っているもの",v:0},
]},
{id:24,s:3,type:'sf',q:"班や部活・係の中で、あなたが自然と守ろうとするものは？",opts:[
  {jp:"人・資源・役割を最適に組み合わせること",v:{ex:4,in:2,rb:2,st:1}},
  {jp:"核となる信念・価値観がブレないこと",v:{ex:4,in:1,rb:2,st:1}},
  {jp:"全員に同じ基準で公平に接すること",v:{ex:5,in:1,rb:2,st:1}},
  {jp:"リスクを事前に洗い出し、慎重に進めること",v:{ex:4,in:1,rb:1,st:3}},
  {jp:"やると言ったことは必ずやり切ること（価値観として）",v:{ex:5,in:1,rb:1,st:1}},
]},
{id:25,s:3,type:'c',q:"班活動や部活で、自分より雑なやり方をしている人がいるとき、どうなる？",opts:[
  {jp:"言いにくいが、不満を感じる",c:150},
  {jp:"自分がカバーする。文句は言わない（それが役目だ）",c:175},
  {jp:"それぞれのペースがある。特に気にならない",c:250},
  {jp:"基準を確認して、一緒に改善策を考える",c:310},
  {jp:"その人のやり方を理解しようとする",c:350},
]},
{id:26,s:3,type:'ffs',q:"物事を判断するとき、自分が最も大切にしていることに近いのは？",opts:[
  {jp:"感情より事実と論理を優先して判断したい",v:{ac:1,ma:2,exp:2,di:5,co:3}},
  {jp:"関わる人の気持ちを大切にしながら判断したい",v:{ac:4,ma:2,exp:2,di:2,co:2}},
  {jp:"過去の経験やうまくいった例から判断したい",v:{ac:2,ma:4,exp:1,di:3,co:3}},
  {jp:"根拠と結論の間に矛盾がないことを確認してから決める",v:{ac:1,ma:3,exp:2,di:4,co:4}},
  {jp:"直感と論理の両方を組み合わせて判断したい",v:{ac:3,ma:2,exp:3,di:3,co:2}},
]},
{id:27,s:3,type:'sn',q:"文化祭の出し物など、新しい企画を考えるとき、どこから始めることが多い？",opts:[
  {jp:"具体的なやり方・手順から考え始める",v:2},
  {jp:"全体像やイメージから考え始める",v:-2},
  {jp:"似た事例や過去にうまくいった例から考え始める",v:1},
  {jp:"「もしこうだったら」という仮説から考え始める",v:-1},
  {jp:"まず課題（解決すべき問題）を明確にしてから考える",v:0},
]},
{id:28,s:3,type:'ffs',q:"ノートや考えを整理するとき、自分に一番近いのは？",opts:[
  {jp:"分類・カテゴリ分けして、構造を明確にしたい",v:{ac:1,ma:3,exp:1,di:5,co:3}},
  {jp:"書き出しながら、流れの中で整理していく",v:{ac:2,ma:2,exp:3,di:2,co:2}},
  {jp:"まず全部並べてから、関係性を見つける",v:{ac:1,ma:2,exp:2,di:4,co:3}},
  {jp:"誰かと話しながら整理するのが一番やりやすい",v:{ac:4,ma:2,exp:3,di:1,co:1}},
  {jp:"実際に動かしながら整理する。考えより行動が先",v:{ac:1,ma:1,exp:4,di:2,co:2}},
]},
{id:29,s:3,type:'c',q:"勉強や部活がうまくいったとき、その成功をどう解釈する？",opts:[
  {jp:"たまたまうまくいっただけ。次は失敗するかも",c:100},
  {jp:"自分の努力が報われたと感じる",c:200},
  {jp:"うれしいが、次に活かすことをすぐ考える",c:310},
  {jp:"関わった人全員の成果だと感じる",c:400},
  {jp:"その経験が自分の中で糧になっていくのを感じる",c:640},
]},
{id:30,s:3,type:'sn',q:"「良い取り組み方」とはどういうものだと思う？自分の感覚に最も近いのは？",opts:[
  {jp:"具体的な成果（点数・結果）が出ていること",v:2},
  {jp:"関わった人が納得していること",v:0},
  {jp:"将来につながる目標を持って取り組めたこと",v:-2},
  {jp:"細部まで丁寧で、精度が高いこと",v:1},
  {jp:"自分が学び、成長できたと感じること",v:-1},
]},
{id:31,s:4,type:'c',q:"「あなたの弱みは何？」と聞かれたとき、あなたはどうなる？",opts:[
  {jp:"答えたくない。さらけ出すのが怖い",c:100},
  {jp:"弱みに見えない言い方を選ぶ（「完璧主義かな」など）",c:175},
  {jp:"正直に答えるが、少し不安になる",c:200},
  {jp:"具体的に説明できる。直そうとしていることも伝えられる",c:310},
  {jp:"弱みも含めて自分だと思えるので、素直に話せる",c:640},
]},
{id:32,s:4,type:'jp',q:"予定が突然変わったとき（中止・追加・変更）、あなたはどうなる？",opts:[
  {jp:"少しモヤモヤするが、すぐに切り替えられる",v:1},
  {jp:"動揺する。調整のことを考えると疲れる",v:2},
  {jp:"特に気にならない。むしろ新しい展開を楽しめる",v:-2},
  {jp:"状況次第では喜んで受け入れる",v:-1},
  {jp:"まず「なぜ変わったのか」が気になる",v:0},
]},
{id:33,s:4,type:'ffs',q:"何か一つのことに集中して取り組むとき、自分に近いのは？",opts:[
  {jp:"時間を忘れて没頭できる。外の世界が消えるような感覚",v:{ac:1,ma:3,exp:2,di:3,co:5}},
  {jp:"集中はできるが、途中で別のことが気になり始める",v:{ac:2,ma:2,exp:4,di:2,co:2}},
  {jp:"好きなことなら没頭できるが、そうでないとすぐ飽きる",v:{ac:2,ma:2,exp:3,di:2,co:3}},
  {jp:"一つに集中するより、複数を同時に動かす方が向いている",v:{ac:2,ma:1,exp:5,di:2,co:1}},
  {jp:"一つのことを深く掘り下げることが好き。表面で終わりたくない",v:{ac:1,ma:3,exp:2,di:3,co:4}},
]},
{id:34,s:4,type:'sf',q:"考えごとをするとき、あなたが最も心が動く瞬間は？",opts:[
  {jp:"複雑な構造を分解して、因果関係が見えたとき",v:{ex:1,in:1,rb:1,st:5}},
  {jp:"まだ誰も描いていない未来のビジョンが見えたとき",v:{ex:1,in:2,rb:1,st:5}},
  {jp:"関係のないものが突然つながって、アイデアになったとき",v:{ex:1,in:2,rb:1,st:5}},
  {jp:"じっくり一人で考え込んで、静かな洞察が生まれたとき",v:{ex:1,in:1,rb:1,st:5}},
  {jp:"新しいことを学んで、自分がアップデートされていく感覚",v:{ex:1,in:1,rb:1,st:5}},
]},
{id:35,s:4,type:'c',q:"自分が間違っていたとはっきりわかったとき、どうなる？",opts:[
  {jp:"恥ずかしくて、なかったことにしたい",c:30},
  {jp:"なかなか認められず、言い訳を探してしまう",c:150},
  {jp:"認めるのは辛いが、素直に謝る",c:200},
  {jp:"間違いを認めて、修正することに集中できる",c:310},
  {jp:"間違いから何を学んだかに、自然と関心が向く",c:400},
]},
{id:36,s:4,type:'tf',q:"部活やクラスの目標と、メンバー個人の事情が衝突したとき、あなたはどうする？",opts:[
  {jp:"チームの目標を優先する。個人の事情はある程度は自分で対処すべきだ",v:2},
  {jp:"その人の事情をまず聞いて、どこまで配慮できるか考える",v:-1},
  {jp:"目標への影響を明確にして、両方が納得できる落としどころを探す",v:1},
  {jp:"人を犠牲にした成果は意味がないと思う。まず人を守る",v:-2},
  {jp:"ケースバイケース。状況によって変わる",v:0},
]},
{id:37,s:4,type:'ffs',q:"自分の得意分野について、どう感じている？",opts:[
  {jp:"一つのことを深く掘り下げるのが好き。その道を極めたい",v:{ac:1,ma:3,exp:1,di:3,co:5}},
  {jp:"幅広くできる方が安心。一つに絞るより何でもできる方がいい",v:{ac:2,ma:2,exp:4,di:2,co:1}},
  {jp:"得意なことを持ちながら、他の分野とつなぐことに面白さを感じる",v:{ac:2,ma:2,exp:4,di:3,co:5}},
  {jp:"得意分野はあるが、それに固執したくない",v:{ac:2,ma:2,exp:4,di:2,co:2}},
  {jp:"自分にしかできない領域を持ちたい、という意識が強い",v:{ac:1,ma:2,exp:2,di:3,co:4}},
]},
{id:38,s:4,type:'sf',q:"情報や知識に対して、あなたが自然ととる行動は？",opts:[
  {jp:"とにかく集めておく。捨てられない。いつか使える",v:{ex:1,in:1,rb:1,st:5}},
  {jp:"過去の事例・歴史・パターンと照らし合わせる",v:{ex:1,in:1,rb:1,st:5}},
  {jp:"複数の選択肢から最善の道筋を選び出す",v:{ex:2,in:1,rb:1,st:5}},
  {jp:"構造を分析して、見えていないものを見えるようにする",v:{ex:1,in:1,rb:1,st:5}},
  {jp:"組み合わせて新しい何かを生み出す",v:{ex:1,in:2,rb:1,st:5}},
]},
{id:39,s:4,type:'c',q:"「お金」と聞いて、最初に浮かぶイメージは？",opts:[
  {jp:"不安。いつも足りない感じがある",c:100},
  {jp:"欲しい。もっとあれば自由になれる",c:125},
  {jp:"必要なもの。ただのツール",c:250},
  {jp:"エネルギー。使い方が大事",c:350},
  {jp:"特に強い感情はない。今が十分",c:400},
]},
{id:40,s:4,type:'jp',q:"「終わった」という感覚について、自分に近いのは？",opts:[
  {jp:"「いつまでに」「どこまでやれば終わり」がはっきりしないと落ち着かない",v:2},
  {jp:"ある程度できたら「よし」と切り上げられる",v:-1},
  {jp:"終わったと思っても、また直したいところが気になってくる",v:1},
  {jp:"終わりを決めることより、過程を楽しむ方が得意",v:-2},
  {jp:"「終わった」より「次は何する？」の関心が強い。区切りが曖昧でも進める",v:-2},
]},
{id:41,s:5,type:'c',q:"社会的な問題（格差・環境・政治など）のニュースを見たとき、あなたはどうなる？",opts:[
  {jp:"自分には関係ない。見ないようにしている",c:50},
  {jp:"怒りや絶望を感じるが、何もできないと思う",c:100},

  {jp:"自分にできることを考える",c:400},
]},
{id:42,s:5,type:'sf',q:"あなたが「これが自分らしい」と感じる瞬間は？",opts:[
  {jp:"やり遂げた・積み上げた・問題を解決した",v:{ex:5,in:1,rb:1,st:1}},
  {jp:"人を動かした・場を作った・影響を与えた",v:{ex:1,in:5,rb:1,st:1}},

  {jp:"見抜いた・戦略を描いた・理解が深まった",v:{ex:1,in:1,rb:1,st:5}},
  {jp:"整えた・競り勝った・一人ひとりを活かした・考え抜いた",v:{ex:2,in:2,rb:2,st:2}},
]},
{id:43,s:5,type:'sn',q:"物事を記憶したり学んだりするとき、自分に一番近いのは？",opts:[
  {jp:"具体的な例や体験に結びつけると覚えやすい",v:1},
  {jp:"全体のパターンや法則を掴むと一気に理解できる",v:-2},
  {jp:"繰り返し練習すると定着する",v:2},
  {jp:"概念や構造が見えると、細部が自然に入ってくる",v:-1},
  {jp:"図や絵に整理すると覚えやすい",v:0},
]},
{id:44,s:5,type:'ffs',q:"アイデアが浮かぶとき、自分に近いのは？",opts:[
  {jp:"一つのテーマからどんどん連想が広がる",v:{ac:2,ma:1,exp:5,di:2,co:2}},
  {jp:"じっくり考えることで、一つの深い結論に至る",v:{ac:1,ma:3,exp:2,di:3,co:5}},
  {jp:"人と話している中でアイデアが生まれることが多い",v:{ac:4,ma:2,exp:3,di:2,co:1}},
  {jp:"ふとした瞬間（移動中・風呂の中）に突然浮かぶ",v:{ac:1,ma:1,exp:4,di:2,co:3}},
  {jp:"体系的に情報を整理することで、アイデアが出てくる",v:{ac:1,ma:3,exp:2,di:4,co:3}},
]},
{id:45,s:5,type:'c',q:"「死」や「人生の終わり」について考えることはある？",opts:[
  {jp:"怖いので、考えないようにしている",c:100},

{id:46,s:5,type:'ffs',q:"自分が「本当に面白い」と思える瞬間に近いのは？",opts:[
  {jp:"一つのことの奥深さが見えてきたとき",v:{ac:1,ma:3,exp:1,di:3,co:5}},

  {jp:"新しい体験や場所に飛び込んだとき",v:{ac:2,ma:1,exp:5,di:2,co:1}},
  {jp:"人との関わりの中で、何か大事なものが動いたとき",v:{ac:5,ma:2,exp:2,di:2,co:2}},
  {jp:"自分の予想が当たっていたと証明されたとき",v:{ac:1,ma:3,exp:2,di:4,co:4}},
]},
{id:47,s:5,type:'sn',q:"「直感」についてどう思う？自分に近い感覚は？",opts:[
  {jp:"根拠のない直感は信用しにくい。事実の方が頼れる",v:2},

]},
{id:48,s:5,type:'sf',q:"あなたが「存在している意味」を感じるのはどんなとき？",opts:[
  {jp:"明確な言葉で方向を示し、混乱した場を整えたとき",v:{ex:2,in:5,rb:1,st:2}},

  {jp:"自分が場に意味をもたらした・記憶に残ったとき",v:{ex:1,in:5,rb:1,st:1}},
  {jp:"まず始めた。動いた。それが人を引きつけた",v:{ex:3,in:5,rb:1,st:1}},
  {jp:"誰が何と言っても自分への信頼が揺るがなかった",v:{ex:2,in:5,rb:1,st:1}},
]},
{id:49,s:5,type:'c',q:"小さい頃の記憶を振り返ると、最初に感じることは？",opts:[
  {jp:"思い出したくない記憶の方が多い",c:30},
  {jp:"悲しさや後悔が出てくる",c:75},
  {jp:"特に強い感情はない。ただの過去",c:250},
  {jp:"懐かしさや温かさがある",c:350},
  {jp:"今の自分につながる大切な時間だったと感じる",c:640},
]},
{id:50,s:5,type:'d',q:"今この瞬間、体のどこかに緊張を感じますか？",opts:[
  {jp:"肩や首が張っている",c:250},{jp:"お腹や胸のあたりに何かある",c:250},
  {jp:"全身リラックスしている",c:250},{jp:"考えたことなかった",c:250},{jp:"特に感じない",c:250},
]},
{id:51,s:2,type:'anger',q:"授業やホームルームで出した自分の意見がスルーされた。内側で何が動く？",opts:[
  {jp:"あの人の意見は聞くのに、なぜ自分だけ…という気持ちが出る",v:'jealousy'},

{id:52,s:4,type:'anger',q:"自分より練習していない同級生が、先にレギュラーに選ばれた（先に評価された）。まず浮かぶ感覚は？",opts:[

{id:53,s:5,type:'anger',q:"グループ課題で自分がやった部分を、別の人が「自分がやった」として発表した。あなたの内側は？",opts:[

  {jp:"自分の頑張り・存在を無かったことにされた、という怒り",v:'insult'},
  {jp:"グループの信頼やルールが壊れている、という憤り",v:'loss'},
  {jp:"次は自分の担当をちゃんと伝わる形にしようと考える",v:'neutral'},
  {jp:"実害がなければ大きな問題とは感じない",v:'neutral'},
]},
{id:57,s:3,type:'ei',q:"勉強や作業が一段落したとき、自分が自然にやっていることに近いのは？",opts:[
  {jp:"誰かに「終わった！」と話しかける。すぐ伝えたくなる",v:2},
  {jp:"一人で振り返り、次にすることを静かに考える",v:-2},

// 34資質の順位づけ（2026-09-29）
// 同点のとき、以前は「設問の順番が早い資質」が必ず勝っていた（5位と6位の同点は約96%の人に起きる）。
// そのせいで後ろの設問にしか出ない資質（原点思考・自我・戦略性など）がほぼ上位5に入らなかった。
// 同点は「その人の回答全体＋資質名」から作る番号で決める。同じ回答なら毎回同じ結果、どの資質も有利にならない。
function tieKey(seed,name){
  let h=2166136261;
  const str=seed+'|'+name;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function answerSeed(answers){
  return Object.keys(answers).sort((a,b)=>a-b).map(id=>id+':'+(answers[id]&&answers[id].jp||'')).join('/');
}
function rankThemes(themes,answers){
  const seed=answerSeed(answers||{});
  return Object.entries(themes).sort((a,b)=>b[1]-a[1]||tieKey(seed,a[0])-tieKey(seed,b[0]));
}

// FFS同点タイブレーク: 差が0.001未満のとき、MBTI軸とSF34推定テーマで微調整して順位を確定
// 表示用ffsAは変更しない。ランキング決定専用。
function ffsAdjust(ffsA, mbti, themes){
  const adj={ac:0,ma:0,exp:0,di:0,co:0};

  // MBTI軸シグナル（1軸につき±0.05、T/I/Jは2因子に分散）
  if(mbti[2]==='F') adj.ac+=0.05;
  if(mbti[2]==='T'){adj.di+=0.025;adj.co+=0.025;}
  if(mbti[0]==='E') adj.exp+=0.05;
  if(mbti[0]==='I'){adj.ma+=0.025;adj.co+=0.025;}
  if(mbti[1]==='N') adj.di+=0.05;
  if(mbti[1]==='S') adj.ma+=0.05;
  if(mbti[3]==='P') adj.exp+=0.05;
  if(mbti[3]==='J'){adj.ma+=0.025;adj.di+=0.025;}

  // SF34推定テーマ→FFS因子シグナル（上位ほど重み大）
  const SF_FFS={
    // ac = 受容性
    Empathy:'ac',Includer:'ac',Harmony:'ac',Relator:'ac',
    Adaptability:'ac',Connectedness:'ac',Developer:'ac',
    // exp = 拡散性
    Activator:'exp',Woo:'exp',Communication:'exp',
    Ideation:'exp',Futuristic:'exp',Arranger:'exp',
    Positivity:'exp',Learner:'exp',
    // di = 弁別性
    Analytical:'di',Strategic:'di',Intellection:'di',Individualization:'di',
    // ma = 保全性
    Deliberative:'ma',Discipline:'ma',Responsibility:'ma',
    Consistency:'ma',Restorative:'ma',Context:'ma',Input:'ma',
    // co = 凝縮性
    Competition:'co',Significance:'co',SelfAssurance:'co',
    Maximizer:'co',Belief:'co',Focus:'co',Command:'co',Achiever:'co',
  };

  const weights=[0.03,0.025,0.02,0.015,0.01];
  rankThemes(themes,state.answers).slice(0,5).forEach(([theme],i)=>{
    const f=SF_FFS[theme]; if(f) adj[f]+=weights[i];
  });

  const adjusted={};
  Object.keys(ffsA).forEach(k=>{adjusted[k]=ffsA[k]+adj[k];});
  return adjusted;
}

function calcCareerHypotheses(r){
  const themeRank={}; r.topThemes.forEach(([t],i)=>{themeRank[t]=5-i;});
  const mbAxes={E:['eiP','ei'],I:['eiP','ei'],S:['snP','sn'],N:['snP','sn'],T:['tfP','tf'],F:['tfP','tf'],J:['jpP','jp'],P:['jpP','jp']};
  const MBTI_LABEL={E:"外向性（人と関わって充電するタイプ）",I:"内向性（一人で深めるタイプ）",S:"感覚型（具体・実際から考える）",N:"直感型（全体像・可能性から考える）",T:"思考型（論理で判断する）",F:"感情型（人の気持ちで判断する）",J:"計画型",P:"柔軟型"};
  const scored=CAREER_CLUSTERS.map(cl=>{
    let score=0; const why=[];
    // sfA は 2026-09-30 から 0〜15点（上位5資質の順位の重み）。以前の1〜5点の物差しにそろえるため3で割る
    Object.entries(cl.sf||{}).forEach(([k,w])=>{const c=w*(r.sfA[k]||0)/3; score+=c; if(c>=2.2) why.push({c,txt:`強みの向き「${SF_NAMES[k]}」`});});
    Object.entries(cl.ffs||{}).forEach(([k,w])=>{const c=w*(r.ffsA[k]||0); score+=c; if(c>=1.4) why.push({c,txt:`${FFS_NAMES[k]}の高さ`});});
    Object.entries(cl.mbti||{}).forEach(([L,w])=>{const a=mbAxes[L]; if(r.mbtiB[a[0]]===L){const c=w*Math.min(r.mbtiB[a[1]],6)/6*1.5; score+=c; if(c>=0.8) why.push({c,txt:MBTI_LABEL[L]});}});
    (cl.themes||[]).forEach(t=>{if(themeRank[t]){const c=themeRank[t]*0.6; score+=c; why.push({c,txt:`上位資質「${T[t]||t}」`});}});
    why.sort((a,b)=>b.c-a.c);
    return {cl,score,why:why.slice(0,3).map(x=>x.txt)};
  }).sort((a,b)=>b.score-a.score);
  const top3=scored.slice(0,3);
  const ri=top3.reduce((s,x,i)=>s+x.cl.riKei*(3-i),0)/6;
  const bunri=ri>0.35?"どちらかというと理系寄り":ri<-0.35?"どちらかというと文系寄り":"文理どちらでも活きるタイプ";
  return {top3,bunri};
}

function calcAngerType(angerCounts){
  const total=Object.values(angerCounts).reduce((a,b)=>a+b,0);
  if(total===0) return 'balanced';
  const sorted=Object.entries(angerCounts).filter(([k])=>k!=='neutral').sort((a,b)=>b[1]-a[1]);
  if(sorted.length===0) return 'balanced';
  const [top,topN]=sorted[0];
  // 明確な優位がなければバランス型
  if(topN<2 && total>=3) return 'balanced';
  return top;
}

function calcResults(){
  let cS=[],ei=0,sn=0,tf=0,jp=0;
  let sf={ex:0,in:0,rb:0,st:0},sfC={ex:0,in:0,rb:0,st:0};
  let ffs={ac:0,ma:0,exp:0,di:0,co:0},ffsC={ac:0,ma:0,exp:0,di:0,co:0};
  let themes={};
  let angerCounts={jealousy:0,insult:0,loss:0,neutral:0};

  Q.forEach(q=>{
    const a=state.answers[q.id]; if(!a) return;
    if(q.type==='c') cS.push(a.c);
    else if(q.type==='ei') ei+=a.v;
    else if(q.type==='sn') sn+=a.v;
    else if(q.type==='tf') tf+=a.v;
    else if(q.type==='jp') jp+=a.v;
    else if(q.type==='sf'){
      ['ex','in','rb','st'].forEach(k=>{sf[k]+=a.v[k];sfC[k]++;});
      const tm=THEME_MAP[q.id];
      if(tm&&tm[a.jp]) Object.entries(tm[a.jp]).forEach(([t,s])=>{themes[t]=(themes[t]||0)+s;});
    }
    else if(q.type==='ffs'){
      ['ac','ma','exp','di','co'].forEach(k=>{ffs[k]+=a.v[k];ffsC[k]++;});
    }
    else if(q.type==='anger'){
      const v=a.v; if(v&&angerCounts[v]!==undefined) angerCounts[v]++;
    }
  });

  const cAvg=cS.length?Math.round(cS.reduce((a,b)=>a+b,0)/cS.length):250;
  // 16性格：0点（真ん中）は公式MBTIの採点にそろえてI・N・F・Pにし、midに印を残す（2026-09-30）
  const mbti=(ei>0?'E':'I')+(sn>0?'S':'N')+(tf>0?'T':'F')+(jp>0?'J':'P');
  const mbtiB={ei:Math.abs(ei),eiP:ei>0?'E':'I',sn:Math.abs(sn),snP:sn>0?'S':'N',
                tf:Math.abs(tf),tfP:tf>0?'T':'F',jp:Math.abs(jp),jpP:jp>0?'J':'P'};
  mbtiB.mid=['ei','sn','tf','jp'].filter(k=>mbtiB[k]===0);
  let ffsA={};['ac','ma','exp','di','co'].forEach(k=>{ffsA[k]=ffsC[k]?ffs[k]/ffsC[k]:0;});
  const topThemes=rankThemes(themes,state.answers).slice(0,5);
  const dom=rankDomains(topThemes);
  const sfA=dom.sc; // 0〜15点（上位5資質の順位の重みの合計）
  const sfS=dom.order.map(k=>[k,sfA[k]]);
  const sfTied=sfS[0][1]===sfS[1][1];
  // 構造的バイアス補正: 設問設計上 di・exp の全選択肢平均が ac・ma より高いため
  // ランキング用スコアのみ正規化（表示用 ffsA はそのまま）
  // 定数 = 全選択肢平均(2.4572) / 各因子の全選択肢平均
  // ac:2.089, ma:2.286, co:2.536, exp:2.679, di:2.696 (2026-06-11計測)
  const FFS_STRUCT_NORM={ac:1.176,ma:1.075,co:0.969,exp:0.917,di:0.911};
  const ffsNormA={};Object.keys(ffsA).forEach(k=>{ffsNormA[k]=ffsA[k]*FFS_STRUCT_NORM[k];});
  // 同点タイブレーク: 1位と2位、または2位と3位の差が0.001未満のとき微調整スコアで順位を確定
  const ffsRaw=Object.entries(ffsNormA).sort((a,b)=>b[1]-a[1]);
  const ffsTied=Math.abs(ffsRaw[0][1]-ffsRaw[1][1])<0.001||Math.abs(ffsRaw[1][1]-ffsRaw[2][1])<0.001;
  const ffsForRank=ffsTied?ffsAdjust(ffsNormA,mbti,themes):ffsNormA;
  const ffsS=Object.entries(ffsForRank).sort((a,b)=>b[1]-a[1]);
  const ffsNv=Object.values(ffsNormA);
  const ffsBalanced=Math.max(...ffsNv)-Math.min(...ffsNv)<=MISO_SPREAD;
  const angerType=calcAngerType(angerCounts);

  return{cAvg,mbti,mbtiB,sfA,sfTop:sfS[0][0],sfSecond:sfS[1][0],sfTied,
         ffsA,ffsTop:ffsS[0][0],ffsSecond:ffsS[1][0],topThemes,themesAll:themes,
         ffsTied,ffsBalanced,angerType,angerCounts};
}

function renderSectionIntro(s){

  app.innerHTML=`

function startSection(s){
  state.phase='question';
  const qs=Q.filter(q=>q.s===s);
  const first=qs.find(q=>!state.answers[q.id]);
  if(!first){endSection(s);return;}
  state.currentQ=first.id;render();
}

function renderQuestion(){
  const q=Q.find(x=>x.id===state.currentQ);if(!q)return;
  const sec=S[q.s-1];
  const sqs=Q.filter(x=>x.s===q.s);
  const qNum=sqs.findIndex(x=>x.id===q.id)+1;
  const overall=Q.filter(x=>x.s<q.s).length+qNum-1;
  setProgress(overall,Q.length);
  const isFC=!!q.fc;
  const isSupp=(q.type==='anger'||isFC);
  // 補足質問以外の問題数のみカウント
  const sqs_main=Q.filter(x=>x.s===q.s&&x.type!=='anger'&&!x.fc);
  const qNumMain=isSupp?null:sqs_main.findIndex(x=>x.id===q.id)+1;
  const totalMain=sqs_main.length;
  // 強制選択は順番を固定（シャッフルしない）
  const opts=isFC?q.opts:getShuffled(q);
  const selOpt=state.answers[q.id];
  const metaLabel=isSupp
    ?`Section ${q.s} — ${sec.title} &nbsp;/&nbsp; <span style="color:#8b5e3c">補足問題</span>`
    :`Section ${q.s} — ${sec.title} &nbsp;/&nbsp; Q${qNumMain} of ${totalMain}`;
  app.innerHTML=`
  <div class="question-wrap">
    <div class="q-meta">${metaLabel}</div>
    ${isFC?`<div class="q-fc-tag">— どちらが、より自分に近い？ —</div>`:''}
    <div class="q-text">${q.q}</div>
    <div class="${isFC?'opts opts--fc':'options'}">
      ${opts.map((o,i)=>`<button class="opt${selOpt===o?' selected':''}" onclick="selectOpt(${q.id},${i})">${isFC?String.fromCharCode(65+i)+'. ':''}${o.jp}</button>`).join('')}
    </div>
    <span class="nav-back" onclick="goBack()">← 前の問いに戻る</span>
  </div>`;
}

function selectOpt(qid,di){
  const q=Q.find(x=>x.id===qid);
  const chosen=(q.fc?q.opts:getShuffled(q))[di]; // 二択は固定表示なので、表示と同じ並びから取る（2026-09-30）
  state.answers[qid]=chosen;
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));
  document.querySelectorAll('.opt')[di].classList.add('confirmed');
  setTimeout(()=>{
    const sqs=Q.filter(x=>x.s===q.s);
    const idx=sqs.findIndex(x=>x.id===q.id);
    const next=sqs[idx+1];
    if(next){state.currentQ=next.id;render();}
    else endSection(q.s);
  },600);
}

function endSection(s){
  if(s<5){state.phase='section-intro';state.section=s+1;}
  else state.phase='results';
  render();
}

function goBack(){
  const q=Q.find(x=>x.id===state.currentQ);
  const sqs=Q.filter(x=>x.s===q.s);
  const idx=sqs.findIndex(x=>x.id===q.id);
  if(idx>0){state.currentQ=sqs[idx-1].id;render();}
  else if(q.s>1){
    const prev=Q.filter(x=>x.s===q.s-1);
    state.currentQ=prev[prev.length-1].id;state.phase='question';render();
  }
}

function toggleTable(){
  const el=document.getElementById('ctable');
  const btn=el.previousElementSibling;
  if(el.style.display==='none'){el.style.display='block';btn.textContent='▲ 意識レベル全16段階を閉じる';}
  else{el.style.display='none';btn.textContent='▼ 意識レベル全16段階を見る';}

function buildStageTable(cAvg){
  const MEASURE_MIN = 75;
  const MEASURE_MAX = 524;
  const rows=[...STAGES].reverse().map(s=>{
    const cur = cAvg>=s.min && cAvg<=s.max;
    const out = s.max < MEASURE_MIN || s.min > MEASURE_MAX;
    const rowStyle = cur ? ' style="background:#fdf6f0;font-weight:700"'
                   : out ? ' style="opacity:0.35"' : '';
    const badge = out
      ? `<span style="font-size:9px;color:#bbb;border:1px solid #ddd;border-radius:3px;padding:1px 4px;margin-left:5px;vertical-align:middle">測定範囲外</span>`
      : '';
    return`<tr${rowStyle}>
      <td>${s.emoji} ${s.name}${badge}<br><span style="color:#aaa;font-weight:400">${s.en}</span></td>
      <td style="white-space:nowrap;color:#888">${s.min}–${s.max}</td>
      <td style="color:#555;font-size:11px;line-height:1.6">${s.desc.slice(0,40)+'…'}${cur?' ← あなた':''}</td>
    </tr>`;
  }).join('');
  return`<table class="c-table"><thead><tr>
    <th>ステージ</th><th>スコア</th><th>特徴</th>
  </tr></thead><tbody>${rows}</tbody>
  <tfoot><tr><td colspan="3" style="font-size:10px;color:#aaa;padding:6px 8px">
    ※ この診断の測定範囲：悲嘆〜理性（75〜449）
  </td></tr></tfoot></table>`;
}

function showToast(msg,type=''){
  let el=document.getElementById('gas-toast');
  if(!el){el=document.createElement('div');el.id='gas-toast';el.className='toast';document.body.appendChild(el);}
  el.textContent=msg;
  el.className='toast show'+(type?' '+type:'');
  clearTimeout(el._t);
  el._t=setTimeout(()=>{el.className='toast';},type==='err'?6000:3000);
}

async function submitResults(){
  if(state.submitted) return;  // 二重送信防止
  state.submitted = true;
  const r=state.lastResult;
  if(!r) return;
  const arc=getArchetype(r.ffsTop,r.ffsSecond,r.ffsBalanced);
  const stage=getStage(r.cAvg);

  // HTMLスナップショットを生成（結果画面の静的コピーとしてローカル保存する）
  const _styles  = document.querySelector('style').outerHTML;
  const _appHtml = document.getElementById('app').outerHTML;
  const _today   = new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
  const _htmlSnap = `<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>心のカルテ — ${state.userName}（${_today}）</title>\n${_styles}\n</head>\n<body>\n${_appHtml}\n</body>\n</html>`;

  // ── Student版：外部送信は行わず、この端末にファイル保存する ──
  // TSVは大人版スプレッドシートと同じ31列順（row_to_input.py にそのまま渡せる）
  const HYPHEN_FIX={SelfAssurance:'Self-Assurance'};
  const themeName=t=>HYPHEN_FIX[t]||t;
  const pad=n=>String(n).padStart(2,'0');
  const now=new Date();
  const ts=`${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const mb=r.mbtiB, sf=r.sfA, ffs=r.ffsA;
  const th=i=>(r.topThemes[i]?themeName(r.topThemes[i][0]):'');
  const r2=x=>Math.round(x*100)/100;
  const clean=s=>String(s||'').replace(/[\t\n]/g,' ');
  const tsvRow=[
    ts, state.userName, Math.round(r.cAvg), stage.name, r.mbti,
    mb.eiP+mb.ei, mb.snP+mb.sn, mb.tfP+mb.tf, mb.jpP+mb.jp,
    r.sfTop, r.sfSecond,
    r2(sf.ex), r2(sf.in), r2(sf.rb), r2(sf.st),
    th(0), th(1), th(2), th(3), th(4),
    r.ffsTop, r.ffsSecond,
    r2(ffs.ac), r2(ffs.ma), r2(ffs.exp), r2(ffs.di), r2(ffs.co),
    arc.name, r.angerType||'', (r.cAvg<200?'⚠️ 要注意':''), clean(buildScreeningNote(r))
  ].join('\t');
  const dl=(fname,content,mime)=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([content],{type:mime}));
    a.download=fname;document.body.appendChild(a);a.click();a.remove();
  };
  const day=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;
  try{
    dl(`心のカルテStudent_結果データ_${state.userName}_${day}.txt`, tsvRow, 'text/plain');
    dl(`心のカルテStudent_${state.userName}_${day}.html`, _htmlSnap, 'text/html');
    showToast('✅ 結果を2つのファイルとして保存しました（ダウンロードフォルダ）','ok');
  }catch(e){
    console.warn('保存エラー:', e.message);
    console.log('結果TSV:', tsvRow);
    showToast('❌ 自動保存に失敗しました。コンソールにTSVを出力しています','err');
  }
}

function buildMessage(r){
  const arc = getArchetype(r.ffsTop, r.ffsSecond, r.ffsBalanced);
  const stage = getStage(r.cAvg);
  const below200 = r.cAvg < 200;
  const boundary = r.cAvg >= 200 && r.cAvg < 225;

  // SF核心
  const sfCore = {
    ex:"「動かし、やり切る力」",
    in:"「人を巻き込み、場を広げる力」",
    rb:"「人とのつながりを育む力」",
    st:"「構造を見抜き、先を読む力」",
  };

  // 200以上：バンド別メッセージ（aバンドはsfTopで4分岐）
  const posBand = r.cAvg<275?'a':r.cAvg<375?'b':r.cAvg<450?'c':r.cAvg<525?'d':'e';
  const posMsgA = {
    st:"構造を見抜く力が土台にある。動き始めることで、その読みが現実を動かす力になる。",
    ex:"動くことが強み。方向性が定まったとき、そのエネルギーは一気に花開く。",
    rb:"つながりを育てる力がある。自分自身を信頼できるようになるほど、その場が深まる。",
    in:"場を動かす種を持っている。内側の軸が固まるほど、影響力が本物になる。",
  };
  const posMsg = {
    b:"成長と貢献への意欲が高い。才能が最も活きやすいエネルギー状態にある。",
    c:"自分と他者をありのままに受け入れながら、力を発揮できる状態。",
    d:"理性と愛が統合されつつある。関わる場が自然と整い、人が集まりやすい。",
    e:"存在そのものが強み。場が自然と発酵し始める段階にある。",
  };

  let out = `あなたの核心は<b>${sfCore[r.sfTop]}</b>。`;

  if(below200){
    out += `<br><br>`;
    out += `発酵アーキタイプは<b>「${arc.name}」</b>。${arc.desc}`;
  } else if(boundary){
    out += `<br><br>`;
    out += `現在地：${stage.name}（${r.cAvg}）— 意識の臨界点にある。<br>`;
    out += `現実を直視して行動できる起点に立っている。失敗を糧にする力が育ち始めている。<br><br>`;
    out += `発酵アーキタイプ「<b>${arc.name}</b>」として、ここから本来の醸し方が始まる。${arc.desc}`;
  } else {
    const bandMsg = posBand==='a' ? (posMsgA[r.sfTop]||posMsgA.st) : posMsg[posBand];
    out += `${bandMsg}<br><br>`;
    out += `発酵アーキタイプは<b>「${arc.name}」</b>。${arc.desc}`;
  }

  return out;
}

// ── スクリーニングメモ生成（GAS送信用・本人非表示）────────
function buildScreeningNote(r){
  if(r.cAvg >= 200) return '';
  const arc   = getArchetype(r.ffsTop, r.ffsSecond, r.ffsBalanced);
  const stage = getStage(r.cAvg);
  const sfNegLoop = {
    ex:"「動く」こと自体がエネルギー消耗の手段になる。方向性のないまま疲弊しやすい。",
    in:"承認欲求が強まり、認められないと自己否定か攻撃に転じやすい。場を広げようとするが、広げるほど消耗する。",
    rb:"他者の感情を引き受けすぎ、境界が曖昧になる。「NO」が言えず、つながりが重荷になる。",
    st:"思考が分析から「不安の合理化」に変わる。計画は精緻になるが、実行されないまま終わる。",
  };
  const arcNegLoop = {
    "麹タイプ":      "他者を醸そうとするが自分が先に消耗する。自己犠牲が習慣化し「自分はどうしたいか」が見えなくなる。",
    "糠床タイプ":    "何でも受け入れすぎて過発酵になる。かき混ぜ続けることに疲れ、自分の軸が溶けていく。",
    "白カビタイプ":  "内側に深く籠り、外に出てこられなくなる。「わかってもらえない」という感覚が強まる。",
    "天然酵母タイプ":"化学反応は起きるが着地しない。エネルギーが散漫になり、何も完了しないまま次へ向かう。",
    "乳酸菌タイプ":  "酸味（批判）が強くなりすぎ、腐敗を防ぐはずが場を腐敗させる側に回る。",
    "青カビタイプ":  "強烈な個性が孤立を生む。「どうせわかってもらえない」という怒りと諦めが積み重なる。",
    "塩タイプ":      "基準が厳しくなりすぎ、自分にも他者にも腐食作用を及ぼす。完璧主義が動けなさを生む。",
    "協会酵母タイプ":"環境が整わないと発酵が完全に止まる。「条件が揃うまで動かない」が習慣化する。",
    "納豆菌タイプ":  "粘り強さが手放せなさに変わる。こだわるものが増え、前に進めなくなる。",
    "酪酸菌タイプ":  "重要な働きをしているのに誰にも気づかれないという孤独が深まり、自己価値が見えにくくなる。",
    "木桶タイプ":    "変化を拒絶し、古い場を守ることが自己目的化する。変われない自分への無力感が生まれる。",
    "味噌タイプ":    "どこにでも合わせすぎて、自分が何者かわからなくなる。「まあいいか」が判断を失わせていく。",
  };
  const angerNote = {
    insult:'侮辱型（自己肯定感：比較的高め。境界線が脅かされた時に反応）',
    jealousy:'嫉妬型（自己肯定感：外に置きがち。他者比較から怒りが来る）',
    loss:'不利益型（制度・公平性への反応。正義感型）',
    balanced:'バランス型（状況依存）',
  };
  let note = `【意識ステージ】${stage.name}（${r.cAvg}）/ 200未満\n`;
  note += `【怒りタイプ】${angerNote[r.angerType]||r.angerType||'未回答'}\n`;
  note += `【SFドメイン：${r.sfTop}】${sfNegLoop[r.sfTop]||''}\n`;
  note += `【アーキタイプ：${arc.name}】${arcNegLoop[arc.name]||arc.stress||''}`;
  return note;
}
